# Development and test infrastructure for bms. Not a production deployment.
#
#   cp deploy/compose/.env.example deploy/compose/.env   # then edit the passwords
#   make up                                              # database + mail
#   docker compose ... --profile oidc up -d              # optional local OIDC provider
#   docker compose ... --profile s3 up -d                # optional S3 store (SeaweedFS) for the s3 file store
#   make observe                                         # + Grafana, Loki, Tempo, Prometheus, Alloy
#
# Observability: point bms at OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 and open
# Grafana on :3000 (no login in development).
#
# Integration tests (go test -tags integration) read the BMS_TEST_* variables in .env.example.
name: bms-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: bms
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: bms
    ports: ["${DB_PORT:-5432}:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bms -d bms"]
      interval: 5s
      timeout: 3s
      retries: 20

  # SMTP catcher for notification tests. Web UI on :8025.
  mailpit:
    image: axllent/mailpit:latest
    # Accept any SMTP AUTH credentials, also on a plaintext connection, so integration
    # tests cover the AUTH path (notify.md, Q-MAILPIT-AUTH). Development only.
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports: ["${SMTP_PORT:-1025}:1025", "${MAILPIT_UI_PORT:-8025}:8025"]

  # Local OIDC provider for login tests (stands in for any OIDC provider).
  # Needs deploy/compose/dex/config.yaml, written with the identity spec.
  dex:
    profiles: [oidc]
    image: ghcr.io/dexidp/dex:v2.41.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes: ["./dex/config.yaml:/etc/dex/config.yaml:ro"]
    ports: ["${DEX_PORT:-5556}:5556"]

  # S3-compatible object store for the files s3 implementation and its integration tests
  # (files.md, Q-FILES2). Development only. SeaweedFS (Apache-2.0) in one container: master,
  # volume server, filer and the S3 gateway on :9000. Two buckets are created by `seaweedfs-init`:
  # "bms" (private) and "bmspublic" (anonymous reads allowed, so the start-up probe's refusal of
  # a public bucket can be tested). The tests read BMS_TEST_S3_* from .env.example.
  seaweedfs:
    profiles: [s3]
    image: chrislusf/seaweedfs:3.85
    # The S3 identities file is written at start from S3_ACCESS_KEY and S3_SECRET_KEY, so the
    # keys live in .env only. The "anonymous" identity may read "bmspublic" and nothing else.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        test -n "$${S3_SECRET_KEY}" || { echo "set S3_SECRET_KEY in .env" >&2; exit 1; } &&
        printf '{"identities":[{"name":"dev","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]},{"name":"anonymous","actions":["Read:bmspublic","List:bmspublic"]}]}' "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" > /tmp/s3.json &&
        exec /usr/bin/weed server -ip.bind=0.0.0.0 -dir=/data -master.volumeSizeLimitMB=64 -volume.max=20 -s3 -s3.port=9000 -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-bmsdev}
      # Empty when unset: compose resolves every service's variables even for an inactive
      # profile, so a required (:?) here would break `docker compose` for anyone without the s3
      # profile. The container refuses to start with an empty secret.
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    ports: ["${S3_PORT:-9000}:9000"]
    volumes: [seaweedfs-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -O /dev/null http://127.0.0.1:8888/ && nc -z 127.0.0.1 9000"]
      interval: 5s
      timeout: 3s
      retries: 20

  seaweedfs-init:
    profiles: [s3]
    image: chrislusf/seaweedfs:3.85
    depends_on:
      seaweedfs: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        printf 's3.bucket.create -name bms\ns3.bucket.create -name bmspublic\n' |
        /usr/bin/weed shell -master=seaweedfs:9333
    restart: "no"

  # --- Observability (profile "observability", D20). bms sends OTLP to Alloy only. ---
  alloy:
    profiles: [observability]
    image: grafana/alloy:v1.19.2
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    volumes: ["./observability/alloy.alloy:/etc/alloy/config.alloy:ro"]
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
      - "${ALLOY_UI_PORT:-12345}:12345"
    depends_on: [loki, tempo, prometheus]

  loki:
    profiles: [observability]
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["${LOKI_PORT:-3100}:3100"]

  tempo:
    profiles: [observability]
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./observability/tempo.yaml:/etc/tempo.yaml:ro"]
    ports: ["${TEMPO_PORT:-3200}:3200"]

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.13.4
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --storage.tsdb.retention.time=1y  # telemetry.md decision 18
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.0.10
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes: ["./observability/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/bms.yaml:ro"]
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    depends_on: [loki, tempo, prometheus]

volumes:
  db-data:
  seaweedfs-data:
