# Single-process Tempo for development. Traces are kept in the container only.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: "0.0.0.0:4317" }

storage:
  trace:
    backend: local
    local: { path: /tmp/tempo/traces }
    wal: { path: /tmp/tempo/wal }

# Traces are kept 30 days (telemetry.md decision 18): spans hold person IDs only and are
# not covered by per-person export or deletion, so a bounded retention is what makes that a
# true privacy statement. Logs (Loki) are kept 30 days and metrics (Prometheus) 1 year.
compactor:
  compaction:
    block_retention: 720h

# Request rates, errors and durations per route, and the service graph, derived from traces.
metrics_generator:
  storage:
    path: /tmp/tempo/generator
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
