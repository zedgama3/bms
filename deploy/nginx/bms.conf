# nginx in front of bms on the same host, here reached through a tunnel (such as cloudflared)
# that ends TLS and connects to this server on loopback. bms trusts the forwarding headers
# only from BMS_HTTP_TRUSTED_PROXIES=127.0.0.1/32, and this server replaces, never appends
# to, whatever X-Forwarded-For a client sent.
# Request logs are personal data. This format leaves out the visitor's address, the query
# string (a password-reset link carries its one-time token there; a search carries a name)
# and the Referer, which repeats both.
log_format bms_private '$time_iso8601 $request_method $uri $status $body_bytes_sent $request_time';

upstream bms {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    # Loopback only: the tunnel is the one way in. For a server that faces the internet
    # itself, listen on 443 with ssl and your certificate, redirect port 80 to it, drop the
    # real_ip lines and send X-Forwarded-Proto $scheme.
    listen 127.0.0.1:80;
    listen [::1]:80;
    server_name bms.example.org;
    server_tokens off;
    access_log /var/log/nginx/bms.access.log bms_private;

    # The visitor's address as the tunnel reports it. Cloudflare sets CF-Connecting-IP and
    # overwrites any value a client sent; other tunnels name their own header.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    # The largest upload bms accepts is the files.max_bytes setting (25 MiB by default),
    # plus room for the multipart framing. bms enforces its own per-route limits.
    client_max_body_size 30m;

    location / {
        proxy_pass http://bms;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # TLS ended at the tunnel, the only way in; never pass on a value a client sent.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
