# Lint configuration. depguard encodes the layer rules in plan/07-abstractions.md:
# a depguard failure is a design problem, not a lint nuisance.
# "A module never imports another module" is checked by scripts/check-module-imports.sh
# (make imports), because depguard can't express "any sibling".
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - depguard
    - errorlint     # %w wrapping, errors.Is/As instead of == and type switches
    - wrapcheck     # errors from other packages are wrapped with context
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - noctx         # outbound I/O takes a context
    - contextcheck
    - nilerr        # returning nil after checking err != nil
    - errname
    - gosec
    - misspell
    - revive
    - sloglint      # structured, attribute-only slog calls
    - forbidigo
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true # "_ = f()" on a fallible call is not allowed
    wrapcheck:
      ignore-package-globs:
        - github.com/zedgama3/bms/internal/lib/errs # errs.E is the wrapper
    sloglint:
      attr-only: true
      no-global: all
      context: scope
    forbidigo:
      forbid:
        - pattern: ^time\.Sleep$
          msg: use lib/clock; tests must not sleep
        - pattern: ^log\.(Print|Fatal|Panic).*$
          msg: use a *slog.Logger passed in
        - pattern: ^fmt\.Print.*$
          msg: use a *slog.Logger passed in (cmd/ may write to stdout explicitly)
        - pattern: ^otel\.(GetTracerProvider|Tracer|Meter)$
          msg: no OpenTelemetry globals; take a telemetry.Tracer or telemetry.Meter from app (telemetry.md decision 1)
    depguard:
      rules:
        third-party-bans:
          files: ["$all"]
          deny:
            - pkg: github.com/stretchr/testify
              desc: "use the standard testing package"
            - pkg: github.com/golang/mock
              desc: "hand-written fakes only"
            - pkg: go.uber.org/mock
              desc: "hand-written fakes only"
            - pkg: github.com/pkg/errors
              desc: "use internal/lib/errs and the errors package"
            - pkg: gorm.io
              desc: "no ORM: plain SQL (postgres-sql skill)"
        foundation-lib:
          # lib depends on nothing in the project except lib.
          files:
            - "**/internal/lib/**"
            - "!**/internal/lib/testkit/**"
          list-mode: strict
          allow:
            - "$gostd"
            - github.com/zedgama3/bms/internal/lib
        foundation-model:
          # model depends only on lib (its black-box tests also import model itself).
          files:
            - "**/internal/model/**"
          list-mode: strict
          allow:
            - "$gostd"
            - github.com/zedgama3/bms/internal/lib
            - github.com/zedgama3/bms/internal/model
        config:
          # config is a leaf: stdlib and lib only. cmd/bms and internal/app are its only importers.
          files:
            - "**/internal/config/**"
          list-mode: strict
          allow:
            - "$gostd"
            - github.com/zedgama3/bms/internal/lib
            - github.com/zedgama3/bms/internal/config
        contracts:
          # D19: shared interfaces and data types only; they depend on model, lib and other contracts.
          files:
            - "**/internal/contracts/**"
          list-mode: strict
          allow:
            - "$gostd"
            - github.com/zedgama3/bms/internal/lib
            - github.com/zedgama3/bms/internal/model
            - github.com/zedgama3/bms/internal/contracts
        core:
          # Core contracts and their implementations never know about modules, HTTP or app.
          files:
            - "**/internal/core/**"
          deny:
            - pkg: github.com/zedgama3/bms/internal/modules
              desc: "the core never imports a module; modules plug into the core"
            - pkg: github.com/zedgama3/bms/internal/api
              desc: "the core doesn't know about HTTP"
            - pkg: github.com/zedgama3/bms/internal/app
              desc: "only main imports app"
            - pkg: github.com/zedgama3/bms/internal/config
              desc: "the core receives typed options from app, not the app config"
            - pkg: github.com/zedgama3/bms/web
              desc: "only app imports the web embed (web-shell.md)"
        modules:
          # A module depends on core contracts, model and lib. Never another module
          # (make imports), app, the api shell or the app config.
          files:
            - "**/internal/modules/**"
          deny:
            - pkg: github.com/zedgama3/bms/internal/app
              desc: "modules never import the composition root"
            - pkg: github.com/zedgama3/bms/internal/api
              desc: "modules contribute routes through the module contract, not by importing the api shell"
            - pkg: github.com/zedgama3/bms/internal/config
              desc: "modules receive typed options from app, not the app config"
            - pkg: github.com/zedgama3/bms/web
              desc: "only app imports the web embed (web-shell.md)"
        storage-seam:
          # D8: only postgres/ packages and core db touch the driver. Everything else talks
          # to a storage interface, so PostgreSQL can be replaced later.
          files:
            - "$all"
            - "!**/postgres/**"
            - "!**/internal/core/db/**"
            - "!**/internal/lib/testkit/**"
          deny:
            - pkg: github.com/jackc/pgx
              desc: "SQL lives only in a postgres/ package behind a storage interface (D8)"
            - pkg: database/sql
              desc: "SQL lives only in a postgres/ package behind a storage interface (D8)"
        otel-seam:
          # telemetry.md decision 1: only core/telemetry imports the OpenTelemetry API and
          # SDK, so the privacy policy on attributes cannot be bypassed and an SDK upgrade
          # touches one package. Everything else uses telemetry.Tracer, telemetry.Meter
          # and a *slog.Logger. Files under internal/core/telemetry/ are excluded here, so
          # go.opentelemetry.io is allowed there and nowhere else.
          files:
            - "$all"
            - "!**/internal/core/telemetry/**"
          deny:
            - pkg: go.opentelemetry.io
              desc: "telemetry wraps the SDK; use telemetry.Tracer, Meter and slog (telemetry.md)"
        api:
          files: ["**/internal/api/**"]
          deny:
            - pkg: github.com/zedgama3/bms/internal/modules
              desc: "the api shell mounts routes it is given; only app knows the modules"
            - pkg: github.com/zedgama3/bms/internal/app
              desc: "only main imports app"
            - pkg: github.com/zedgama3/bms/internal/config
              desc: "the api shell receives typed options from app, not the app config"
            - pkg: github.com/zedgama3/bms/web
              desc: "only app imports the web embed (web-shell.md)"
        web:
          # web-shell.md: the embed package hands app the built shell. Standard library and
          # lib/errs only; only app imports it (the deny entries above). The repository has
          # one package named web, at the top level.
          files:
            - "**/web/**"
          list-mode: strict
          allow:
            - "$gostd"
            - github.com/zedgama3/bms/internal/lib/errs
            - github.com/zedgama3/bms/web
